name: 更新歷史走勢

on:
  schedule:
    # 每天台北時間 05:00 與 17:00 各跑一次，一週七天都跑（原本只跑週一~六，
    # 且只有一次；改成兩次是為了涵蓋 BTC 等週末也會有新價格的標的）。
    # cron 是 UTC 時間；台北 = UTC+8：05:00 台北 = 21:00 UTC（前一天）、
    # 17:00 台北 = 09:00 UTC。
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 抓取歷史K線
        run: node scripts/fetch-history.mjs

      - name: 提交更新後的 JSON 檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git diff --quiet --cached || git commit -m "自動更新歷史走勢 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
