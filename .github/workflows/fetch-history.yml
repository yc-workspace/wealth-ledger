name: 更新歷史走勢

on:
  schedule:
    # 每天台北時間 05:00 與 17:00 各跑一次，一週七天都跑（原本只跑週一~六，
    # 且只有一次；改成兩次是為了涵蓋 BTC 等週末也會有新價格的標的）。
    # cron 是 UTC 時間；台北 = UTC+8：05:00 台北 = 21:00 UTC（前一天）、
    # 17:00 台北 = 09:00 UTC。
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 抓取歷史K線
        run: node scripts/fetch-history.mjs

      - name: 提交更新後的 JSON 檔案（push 失敗時自動 pull --rebase 重試，避免跟其他每分鐘排程的 workflow 撞在一起）
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --quiet --cached; then
            echo "沒有變化，不需要 commit。"
            exit 0
          fi
          git commit -m "自動更新歷史走勢 $(date -u +'%Y-%m-%d %H:%M UTC')"

          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "push 重試 $max_attempts 次仍失敗，放棄。"
              exit 1
            fi
            echo "push 被拒絕（可能跟其他 workflow 撞在一起），第 $attempt 次重試前先 pull --rebase..."
            git pull --rebase
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done
