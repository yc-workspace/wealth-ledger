name: 更新 TAIFEX 保證金資料

on:
  schedule:
    # 每個交易日台北時間 08:30 與 15:30 各跑一次（UTC 00:30 / 07:30）
    # cron 是 UTC 時間；台北 = UTC+8
    - cron: '30 0 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」立即跑一次，方便測試
  # 備註：保證金資料跟個股 ticker 無關（是台指期保證金），本來就是「一觸發就無條件抓」，
  # 不像報價/歷史那樣需要另外做「強制模式」開關，所以這裡不用加 force 相關的 input。

permissions:
  contents: write   # 需要這個權限才能把抓到的 JSON 檔案 commit 回這個 repo

jobs:
  fetch-margin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # 直接用 24，避免「被強制升級」的警告訊息

      - name: 抓取 TAIFEX 保證金資料並轉換
        run: node scripts/fetch-margin.mjs

      - name: 提交更新後的 JSON 檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "自動更新保證金資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
