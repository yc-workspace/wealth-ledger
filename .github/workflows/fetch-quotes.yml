name: 更新即時報價

on:
  schedule:
    # 每分鐘觸發一次；實際要不要抓報價，由 scripts/market-hours.mjs 的時段表決定。
    # 想改抓報價的時間範圍，去改 scripts/market-hours.mjs，不用改這裡的 cron。
    - cron: '* * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略交易時段設定，強制抓取一次（測試用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-quotes
  cancel-in-progress: false

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 抓取即時報價
        run: node scripts/fetch-quotes.mjs
        env:
          FORCE_FETCH: ${{ github.event.inputs.force }}

      - name: 提交更新後的 JSON 檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git diff --quiet --cached || git commit -m "自動更新即時報價 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
